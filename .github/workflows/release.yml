name: Release

# Push a tag like v1.0.0 to build the site zip and publish a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged code
        uses: actions/checkout@v4

      - name: Check the tag matches package.json
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Build the site zip
        run: |
          name="keyscape-$GITHUB_REF_NAME"
          mkdir -p "dist/$name"
          cp -r index.html css js docs .nojekyll README.md CHANGELOG.md LICENSE "dist/$name/"
          (cd dist && zip -r "$name.zip" "$name")

      - name: Pull this version's notes from the changelog
        run: |
          awk -v v="## $GITHUB_REF_NAME" '
            $0 == v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "No section '## $GITHUB_REF_NAME' found in CHANGELOG.md" >&2
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/keyscape-$GITHUB_REF_NAME.zip" \
            --title "Keyscape $GITHUB_REF_NAME" \
            --notes-file dist/notes.md
